name: Deploy Azure Functions

on:
  push:
    branches: [main]
    paths:
      - 'azure-functions/**'
      - '.github/workflows/deploy-azure-functions.yml'
  workflow_dispatch:

jobs:
  lint-and-deploy:
    # MUST run on Windows: the target Function App is a Windows host, and
    # @resvg/resvg-js installs a platform-specific native binary. Building on
    # Linux bundles only the linux-x64 binary, so the function crashes at
    # runtime on Windows with "Cannot find module '@resvg/resvg-js-win32-x64-msvc'".
    runs-on: windows-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: azure-functions/package-lock.json

      - name: Install dependencies
        working-directory: azure-functions
        run: npm ci

      - name: Lint
        working-directory: azure-functions
        run: npm run lint

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: quydly-pipeline-fn
          package: azure-functions
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
